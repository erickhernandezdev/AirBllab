name: Build

on:
  push:
    branches:
      - demo
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: airbnb_admin
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: airbnb_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: airbnb_project

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test database template
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -U airbnb_admin -d postgres -c "CREATE DATABASE airbnb_test_template;"

      - name: Run tests with coverage
        env:
          DB_NAME: airbnb_db
          DB_USER: airbnb_admin
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: 5432
          DEBUG: "True"
        run: |
          coverage run manage.py test
          coverage xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}